services:
  runner:
    image: data.forgejo.org/forgejo/runner:6.4.0
    container_name: forgejo-runner
    restart: unless-stopped
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - FORGEJO_INSTANCE_URL=https://${FORGEJO_DOMAIN:-git.example.invalid}
      - RUNNER_NETWORK=${RUNNER_NETWORK:-ia-stack-forgejo-backend}
    networks:
      - forgejo_network
    volumes:
      - runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.ssh:/root/.ssh:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -euo pipefail
        cd /data

        if [ ! -f /data/config.yml ]; then
          echo "==> Generating clean runner config..."
          cat > /data/config.yml << 'EOF'
        log:
          level: info
        runner:
          file: .runner
          capacity: 1
          timeout: 3h
        container:
          network: "${RUNNER_NETWORK}"
          valid_volumes:
            - "**"
          options: "-v /var/run/docker.sock:/var/run/docker.sock -v /root/.ssh:/root/.ssh:ro"
          labels:
            - "self-hosted-vps:docker://gitea/runner-images:ubuntu-latest"
        EOF
        fi

        if [ ! -s /data/.runner ]; then
          rm -f /data/.runner
          echo "==> Registering runner..."
          forgejo-runner register \
            --no-interactive \
            --token "$$(cat /run/secrets/runner_token)" \
            --name "vps-runner" \
            --instance "$$FORGEJO_INSTANCE_URL" \
            --labels "self-hosted-vps:docker://gitea/runner-images:ubuntu-latest"
          touch /data/.runner
        fi

        exec forgejo-runner daemon --config /data/config.yml
    secrets:
      - runner_token

secrets:
  runner_token:
    file: .runner_token

volumes:
  runner-data:

networks:
  forgejo_network:
    name: ${RUNNER_NETWORK:-ia-stack-forgejo-backend}
    external: true