- name: Read the stored tailnet IP from the server env
  shell: "grep '^TAILSCALE_IP=' {{ stack_dir }}/.env | head -n1 | cut -d= -f2- | tr -d '\\r' || true"
  register: stored_tailnet_ip
  changed_when: false

- name: Read the live tailnet IP
  command: tailscale ip -4
  register: live_tailnet_ip
  changed_when: false
  failed_when: false

# After a recovery (make bootstrap) the server .env may still hold the IP from
# the previous install while the node re-joined the tailnet with a new one.
# Binding Traefik to a stale IP makes `docker compose up` fail with
# "cannot assign requested address", so align the stored IP with the live
# interface before starting the stack. When Tailscale is not up yet (fresh
# bootstrap), fall back to 127.0.0.1; tasks/tailscale.yml stores the real IP
# and restarts the stack to rebind once the VPS has joined.
- name: Align the stored tailnet IP with the live interface
  lineinfile:
    path: "{{ stack_dir }}/.env"
    regexp: '^TAILSCALE_IP='
    line: "TAILSCALE_IP={{ live_tailnet_ip.stdout | trim }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - live_tailnet_ip.rc == 0
    - (live_tailnet_ip.stdout | trim | length) > 0
    - (stored_tailnet_ip.stdout | trim) != (live_tailnet_ip.stdout | trim)

- name: Clear the stored tailnet IP when Tailscale is not up
  lineinfile:
    path: "{{ stack_dir }}/.env"
    regexp: '^TAILSCALE_IP='
    line: "TAILSCALE_IP="
    owner: root
    group: root
    mode: '0600'
  when:
    - live_tailnet_ip.rc != 0 or (live_tailnet_ip.stdout | trim | length) == 0
    - (stored_tailnet_ip.stdout | trim | length) > 0

- name: Start the Docker stack
  command: docker compose up -d
  args:
    chdir: "{{ stack_dir }}"

- name: Wait for the Headscale container to be ready
  command: docker exec {{ headscale_container_name }} headscale health
  register: headscale_version
  until: headscale_version.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  when: headscale_enabled | default(true)

- name: Show Headscale logs when its health check fails
  command: docker logs --tail 100 {{ headscale_container_name }}
  register: headscale_logs
  changed_when: false
  failed_when: false
  when:
    - headscale_enabled | default(true)
    - headscale_version.failed | default(false)

- name: Stop deployment when Headscale is unhealthy
  fail:
    msg: "Headscale did not become healthy. Container logs:\n{{ headscale_logs.stdout | default('No logs available') }}\n{{ headscale_logs.stderr | default('') }}"
  when:
    - headscale_enabled | default(true)
    - headscale_version.failed | default(false)

- name: Create the Headscale user
  command:
    argv:
      - docker
      - exec
      - "{{ headscale_container_name }}"
      - headscale
      - users
      - create
      - "{{ headscale_user }}"
  register: headscale_user_create
  failed_when: >-
    headscale_user_create.rc != 0 and
    'already exists' not in (headscale_user_create.stdout | default('') | lower) and
    'already exists' not in (headscale_user_create.stderr | default('') | lower) and
    'unique constraint' not in (headscale_user_create.stdout | default('') | lower) and
    'unique constraint' not in (headscale_user_create.stderr | default('') | lower)
  changed_when: >-
    headscale_user_create.rc == 0 and
    ('created' in (headscale_user_create.stdout | default('') | lower) or
     'created' in (headscale_user_create.stderr | default('') | lower))
  when: headscale_enabled | default(true)
