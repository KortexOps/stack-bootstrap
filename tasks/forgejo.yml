- name: Check if the PostgreSQL password already exists
  stat:
    path: "{{ stack_dir }}/.postgres_password"
  register: postgres_password_file

- name: Read an existing PostgreSQL password from .env
  shell: "grep '^POSTGRES_PASSWORD=' {{ stack_dir }}/.env | head -n1 | cut -d= -f2- | grep -v '^CHANGE_ME' || true"
  register: existing_postgres_password
  changed_when: false
  when: not postgres_password_file.stat.exists
  no_log: true

- name: Generate the PostgreSQL password
  command: openssl rand -base64 32
  register: generated_postgres_password
  when:
    - not postgres_password_file.stat.exists
    - (existing_postgres_password.stdout | default('') | trim | length) == 0
  no_log: true

- name: Store the PostgreSQL password
  copy:
    content: "{{ (existing_postgres_password.stdout | default(generated_postgres_password.stdout, true)) | trim }}\n"
    dest: "{{ stack_dir }}/.postgres_password"
    owner: root
    group: root
    mode: '0600'
  when: not postgres_password_file.stat.exists
  no_log: true

- name: Read the PostgreSQL password
  slurp:
    src: "{{ stack_dir }}/.postgres_password"
  register: stored_postgres_password
  no_log: true

- name: Set the PostgreSQL password in .env
  lineinfile:
    path: "{{ stack_dir }}/.env"
    regexp: '^POSTGRES_PASSWORD='
    line: "POSTGRES_PASSWORD={{ stored_postgres_password.content | b64decode | trim }}"
    create: true
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Read the Forgejo admin username
  shell: "grep '^FORGEJO_ADMIN_USERNAME=' {{ stack_dir }}/.env | head -n1 | cut -d= -f2- || true"
  register: forgejo_admin_username_raw
  changed_when: false
  no_log: true

- name: Set the Forgejo admin username
  set_fact:
    forgejo_admin_username: "{{ forgejo_admin_username_raw.stdout | trim | default('admin', true) }}"

- name: Read the Forgejo admin email
  shell: "grep '^FORGEJO_ADMIN_EMAIL=' {{ stack_dir }}/.env | head -n1 | cut -d= -f2- || true"
  register: forgejo_admin_email_raw
  changed_when: false
  no_log: true

- name: Verify the Forgejo admin email is set
  assert:
    that:
      - (forgejo_admin_email_raw.stdout | trim) is match('^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')
    fail_msg: "FORGEJO_ADMIN_EMAIL must be a valid email address in .env."

- name: Generate the Forgejo admin password
  shell: |
    set -euo pipefail
    if [ ! -s {{ stack_dir }}/.forgejo_admin_password ]; then
      openssl rand -base64 32 > {{ stack_dir }}/.forgejo_admin_password
      chmod 600 {{ stack_dir }}/.forgejo_admin_password
      echo changed
    else
      chmod 600 {{ stack_dir }}/.forgejo_admin_password
      echo ok
    fi
  register: forgejo_admin_pw_gen
  changed_when: "'changed' in forgejo_admin_pw_gen.stdout"
  no_log: true

- name: Read the Forgejo admin password
  slurp:
    src: "{{ stack_dir }}/.forgejo_admin_password"
  register: forgejo_admin_password
  no_log: true
