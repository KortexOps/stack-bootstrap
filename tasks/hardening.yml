- name: Create the SSH admin user
  user:
    name: "{{ ssh_admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Create the SSH directory for the admin user
  file:
    path: /home/{{ ssh_admin_user }}/.ssh
    state: directory
    owner: "{{ ssh_admin_user }}"
    group: "{{ ssh_admin_user }}"
    mode: '0700'

- name: Check for the root SSH authorized keys file
  stat:
    path: /root/.ssh/authorized_keys
  register: root_authorized_keys

- name: Check if admin user authorized_keys already exists
  stat:
    path: /home/{{ ssh_admin_user }}/.ssh/authorized_keys
  register: admin_authorized_keys

- name: Read existing admin authorized keys if any
  slurp:
    src: /home/{{ ssh_admin_user }}/.ssh/authorized_keys
  register: existing_admin_keys
  when: admin_authorized_keys.stat.exists

- name: Read root authorized keys
  slurp:
    src: /root/.ssh/authorized_keys
  register: root_keys_slurp
  when: root_authorized_keys.stat.exists

- name: Ensure root and admin keys are merged for the admin user
  authorized_key:
    user: "{{ ssh_admin_user }}"
    key: "{{ item }}"
  loop: "{{ (root_keys_slurp.content | b64decode).splitlines() + (existing_admin_keys.content | b64decode | default('')).splitlines() }}"
  when: item | trim | length > 0

- name: Grant passwordless sudo to the admin user
  copy:
    content: "{{ ssh_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: /etc/sudoers.d/{{ ssh_admin_user }}
    owner: root
    group: root
    mode: '0440'
    validate: "visudo -cf %s"

- name: Check for an SSH key on the admin user
  shell: >-
    awk '$1 ~ /^(ssh|ecdsa|sk-)/ { count++ } END { print count + 0 }'
    /home/{{ ssh_admin_user }}/.ssh/authorized_keys
  register: admin_keys
  failed_when: false
  changed_when: false

- name: Abort when disabling root SSH without an admin key
  assert:
    that:
      - admin_keys.rc == 0
      - (admin_keys.stdout | int) > 0
    fail_msg: "ssh_disable_root is true but {{ ssh_admin_user }} has no SSH key - aborting to avoid locking yourself out."
  when: ssh_disable_root

- name: Allow Docker to manage forwarding rules
  lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

- name: Allow SSH through the firewall
  ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Allow HTTP and HTTPS through the firewall
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 80
    - 443

- name: Allow direct Tailscale traffic through the firewall
  ufw:
    rule: allow
    port: 41641
    proto: udp

- name: Check whether the Tailscale interface exists
  command: ip link show tailscale0
  register: tailscale_interface
  changed_when: false
  failed_when: false

- name: Allow HTTPS to the private Traefik entrypoint on Tailscale
  ufw:
    rule: allow
    interface: tailscale0
    direction: in
    port: 443
    proto: tcp
  when: tailscale_interface.rc == 0

- name: Allow SSH on the Tailscale interface
  ufw:
    rule: allow
    interface: tailscale0
    direction: in
    port: 22
    proto: tcp
  when: tailscale_interface.rc == 0

- name: Set the firewall default policy for incoming traffic
  ufw:
    direction: incoming
    policy: deny

- name: Enable the firewall
  ufw:
    state: enabled

- name: Enable strict reverse path filtering
  sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_set: true
    reload: true
  loop:
    - net.ipv4.conf.all.rp_filter
    - net.ipv4.conf.default.rp_filter

- name: Write the hardened SSH drop-in (applied first)
  copy:
    content: |
      # JortexOps — do not edit by hand.
      # This file is loaded early (prefix 00-) so it wins over cloud-init and
      # other drop-ins that may set more permissive values.
      PasswordAuthentication no
      PermitRootLogin {{ 'prohibit-password' if not ssh_disable_root else 'no' }}
    dest: /etc/ssh/sshd_config.d/00-ia-stack-hardening.conf
    owner: root
    group: root
    mode: '0644'
  when: admin_keys.rc == 0 and (admin_keys.stdout | int) > 0

- name: Find drop-in files that may override our hardening
  find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
    excludes: "00-ia-stack-hardening.conf"
  register: ssh_dropins
  when: admin_keys.rc == 0 and (admin_keys.stdout | int) > 0

- name: Remove conflicting PasswordAuthentication from other drop-ins
  lineinfile:
    path: "{{ item.path }}"
    regexp: '^PasswordAuthentication[[:space:]]'
    state: absent
  loop: "{{ ssh_dropins.files }}"
  when:
    - admin_keys.rc == 0 and (admin_keys.stdout | int) > 0
    - ssh_dropins.files | length > 0

- name: Remove conflicting PermitRootLogin from other drop-ins
  lineinfile:
    path: "{{ item.path }}"
    regexp: '^PermitRootLogin[[:space:]]'
    state: absent
  loop: "{{ ssh_dropins.files }}"
  when:
    - admin_keys.rc == 0 and (admin_keys.stdout | int) > 0
    - ssh_dropins.files | length > 0

- name: Validate the SSH configuration
  command: sshd -t
  changed_when: false
  when: admin_keys.rc == 0 and (admin_keys.stdout | int) > 0

- name: Restart the SSH service
  service:
    name: ssh
    state: restarted
  when: admin_keys.rc == 0 and (admin_keys.stdout | int) > 0

- name: Warn when no SSH key is available
  debug:
    msg: "No SSH key found for {{ ssh_admin_user }} - skipping SSH hardening to avoid locking yourself out."
  when: admin_keys.rc != 0 or (admin_keys.stdout | int) == 0
