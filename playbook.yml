- name: Deploiement Stack Serveur
  hosts: all
  become: true
  tasks:
    - name: Mettre a jour les paquets
      apt:
        update_cache: yes
        cache_valid_time: 3600
        update_cache_retries: 5
        update_cache_retry_max_delay: 12
        lock_timeout: 300
        upgrade: dist
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Installer les prerequis
      apt:
        name: [ca-certificates, curl, gnupg, git]
        state: present

    - name: Installer Docker
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Creer le repertoire de destination
      file:
        path: /opt/ia-stack
        state: directory
        mode: '0755'

    - name: Copier la stack docker-compose
      copy:
        src: files/docker-compose.yml
        dest: /opt/ia-stack/docker-compose.yml

    - name: Copier le fichier .env
      copy:
        src: .env
        dest: /opt/ia-stack/.env

    - name: Lancer les conteneurs
      command: docker compose up -d
      args:
        chdir: /opt/ia-stack