- name: Server Stack Deployment
  hosts: vps-ia
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate controller and connection variables
      assert:
        that:
          - ansible_host is defined
          - (ansible_host | string | trim | length) > 0
          - "'YOUR_' not in (ansible_host | string)"
          - ansible_user is defined
          - (ansible_user | string | trim | length) > 0
          - ssh_admin_user is match('^[a-z_][a-z0-9_-]*$')
        fail_msg: "PUBLIC_IP, ANSIBLE_USER and a valid ssh_admin_user are required."

  tasks:
    - name: Base system setup
      include_tasks: tasks/base.yml
      tags: ['base']

    - name: Headscale configuration
      include_tasks: tasks/headscale.yml
      tags: ['headscale']

    - name: Forgejo configuration
      include_tasks: tasks/forgejo.yml
      tags: ['forgejo']

    - name: Start the stack
      include_tasks: tasks/stack.yml
      tags: ['stack']

    - name: Tailscale node setup
      include_tasks: tasks/tailscale.yml
      tags: ['tailscale']

    - name: Re-render Headscale config after the VPS joined the tailnet
      include_tasks: tasks/headscale.yml
      tags: ['headscale']

    - name: Forgejo administrator
      include_tasks: tasks/forgejo-admin.yml
      tags: ['forgejo-admin']

    - name: Server hardening
      include_tasks: tasks/hardening.yml
      tags: ['hardening']

    - name: Backup tooling (rclone + backup script)
      include_tasks: tasks/backup.yml
      tags: ['backup']
